# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
name: aihot

x-app: &app
  build: .
  image: aihot-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    # No proxy in front limits pushes to /api/ingest/items: the api does (per client and minute; 0 turns it off).
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the demo sources, then exits.
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # Let the worker drain backups and paid calls (STOP_TIMEOUT_MS, 470 s), then close its database.
    # Docker sends SIGTERM to the worker first; after this window it kills the remaining processes.
    stop_grace_period: 515s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    # SSR reads the API over HTTP; backend credentials and stored files stay in api/worker.
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      FOLIA_GATEWAY_URL: http://folia-gateway:8080
      FOLIA_SYNC_URL: http://folia-sync:3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./apps/web/public/audio:/app/apps/web/public/audio:ro
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

  folia-gateway:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/gateway.Dockerfile
      args:
        VITE_PUBLIC_BASE: /folia/
        VITE_NETEASE_API_BASE: /folia/netease
        VITE_KUGOU_API_BASE: /folia/kugou
        VITE_QQ_API_BASE: /folia/qq
        VITE_AI_PROVIDER: openai
    image: jluhot-folia-gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0750
    environment:
      FOLIA_AI_PROVIDER: openai
      NAVIDROME_PRESET_ALLOW: private
      FOLIA_TRUSTED_PROXIES: ""
    depends_on:
      folia-backend:
        condition: service_healthy
      folia-netease-api:
        condition: service_healthy
      folia-kugou-api:
        condition: service_healthy
      folia-qq-api:
        condition: service_healthy
    networks:
      - default
      - folia-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  folia-backend:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/backend.Dockerfile
    image: jluhot-folia-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      PORT: "3000"
      AI_PROVIDER: openai
      OPENAI_API_URL: ${MAGPIE_BASE_URL:-http://192.168.1.162:3425/v1}
      OPENAI_API_KEY: ${MAGPIE_API_KEY}
      OPENAI_API_MODEL: ${LLM_MODEL:-auto/minimax-m3.1-flash-preview}
      OPENAI_API_TEMPERATURE: "0.7"
    networks:
      folia-internal:
        aliases:
          - backend
      folia-egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  folia-netease-api:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/netease-api.Dockerfile
    image: jluhot-folia-netease-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      FOLIA_FORWARD_CLIENT_IP: "false"
      ENABLE_GENERAL_UNBLOCK: "false"
    networks:
      folia-internal:
        aliases:
          - netease-api
      folia-egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  folia-kugou-api:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/kugou-api.Dockerfile
    image: jluhot-folia-kugou-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      FOLIA_FORWARD_CLIENT_IP: "false"
    networks:
      folia-internal:
        aliases:
          - kugou-api
      folia-egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  folia-qq-api:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/qq-api.Dockerfile
    image: jluhot-folia-qq-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: "3000"
      QQ_AUTH_STATE_PATH: /app/.auth-state/qq-device.json
      QQ_SESSION_SECRET: ${FOLIA_QQ_SESSION_SECRET:-}
    volumes:
      - folia-qq-state:/app/.auth-state
    networks:
      folia-internal:
        aliases:
          - qq-api
      folia-egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  folia-sync:
    build:
      context: ./folia-major
      dockerfile: deploy/docker/images/sync-server.Dockerfile
    image: jluhot-folia-sync
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: "3000"
      DB_PATH: /app/data/folia-sync.db
      SYNC_TOKEN: ${FOLIA_SYNC_TOKEN:-jluhot-folia-sync}
      DASHBOARD_TOKEN: ${FOLIA_DASHBOARD_TOKEN:-}
    volumes:
      - folia-sync-data:/app/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db: {}
  data: {}
  caddy: {}
  folia-qq-state: {}
  folia-sync-data: {}

networks:
  folia-internal:
    internal: true
  folia-egress: {}
